services:
  postgres:
    image: postgres:16-alpine
    container_name: ata-pims-postgres
    environment:
      POSTGRES_DB: ata_pims
      POSTGRES_USER: ata_pims
      POSTGRES_PASSWORD: ata_pims_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ata_pims -d ata_pims"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/exports:/app/exports
      - ./backend/backups:/app/backups

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

